services:
  postgres:
    image: postgres:16
    container_name: fixit_postgres
    restart: always
    environment:
      POSTGRES_USER: fixit_user
      POSTGRES_PASSWORD: fixit_pass
      POSTGRES_DB: fixit_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixit_user -d fixit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fixit-net

  backend:
    image: ${DOCKERHUB_USER}/fixit-backend:latest
    container_name: fixit_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fixit-net

  frontend:
    image: ${DOCKERHUB_USER}/fixit-frontend:latest
    container_name: fixit_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - fixit-net

volumes:
  pgdata:

networks:
  fixit-net:
    external: true